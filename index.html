<script>
document.getElementById('wechat-btn').addEventListener('click', function(e) {
    // 1. 把下面的 '你的微信号' 替换成你真实的微信 ID
    const wechatId = '_Moonlight1116'; 
    
    // 2. 创建一个临时输入框来实现复制功能
    const tempInput = document.createElement('input');
    tempInput.value = wechatId;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand('copy');
    document.body.appendChild(tempInput);
    document.body.removeChild(tempInput);
    
    // 3. 弹窗提示用户
    alert('微信号 ' + wechatId + ' 已复制到剪贴板，正在为你打开微信！');
});
</script>
<script>
document.getElementById('qqmusic-btn').addEventListener('click', function(e) {
    // 判断是否为移动端（手机/平板）
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    if (isMobile) {
        // 如果是手机端，阻止默认的网页跳转，改为尝试唤起 App
        e.preventDefault();
        window.location.href = "qqmusic://qq.com/media/profile?uin=owEiowvAoKvqoc**";
    }
    // 如果是电脑端，则不做干预，正常走原来的 href 网页链接
});
</script>
<script>
document.getElementById('qq-btn').addEventListener('click', function(e) {
    // 1. 请把下面的 123456789 换成你自己的 QQ 号
    const qqNumber = '2932421492'; 
    
    // 2. 核心功能：自动复制 QQ 号到剪贴板
    const tempInput = document.createElement('input');
    tempInput.value = qqNumber;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand('copy');
    document.body.removeChild(tempInput);
    
    // 3. 弹窗提示用户（温馨提示，给用户一个心理预期）
    alert('QQ号【' + qqNumber + '】已复制！\n正在尝试为你打开 QQ 客户端...');
    
    // 4. 智能判断设备，强行发起唤起指令
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    if (isMobile) {
        // 如果是手机端，尝试通过 mqqwpa 协议唤起手机 QQ App
        window.location.href = "mqqwpa://im/chat?chat_type=wpa&uin=" + qqNumber + "&version=1&src_type=web&web_src=oicqzone.com";
    } else {
        // 如果是电脑端，尝试通过 tencent 协议唤起电脑端 QQ.exe
        window.location.href = "tencent://message/?uin=" + qqNumber + "&Site=Mylink&Menu=yes";
    }
});
</script>
